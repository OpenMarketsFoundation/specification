"$schema": "http://json-schema.org/draft-07/schema#"
"$id": "https://github.com/OpenMarketsFoundation/specification/proposals/bookings/schemata/tag/tzid.schema.yaml"
title: "tzid tag"
description: "On a bookable kind:31922 event or kind:30402 listing: the asset's IANA time zone (a kind:31923 uses start_tzid). On a kind:0 profile: the business default, applying to its default resource and to any asset without one."
type: array
minItems: 2
maxItems: 2
items:
  - const: "tzid"
  - { type: string, minLength: 1, description: "IANA time zone, e.g. America/Los_Angeles" }
