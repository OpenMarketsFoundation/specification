"$schema": "http://json-schema.org/draft-07/schema#"
"$id": "https://github.com/OpenMarketsFoundation/specification/proposals/bookings/schemata/tag/accepts_bookings.schema.yaml"
title: "accepts_bookings tag"
description: "On a kind:0 profile: the business accepts bookings for its default resource (e.g. a table). Bookable events and listings are identified by their own openmarkets bookings tag instead."
type: array
minItems: 2
maxItems: 2
items:
  - const: "accepts_bookings"
  - { const: "true" }
