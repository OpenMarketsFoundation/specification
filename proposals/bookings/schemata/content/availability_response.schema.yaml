"$schema": "http://json-schema.org/draft-07/schema#"
"$id": "https://github.com/OpenMarketsFoundation/specification/proposals/bookings/schemata/content/availability_response.schema.yaml"
title: "availability_response content"
description: "Non-binding options answering an availability_request; an empty array means nothing matching is available."
type: object
required: [options]
properties:
  options:
    type: array
    items: { "$ref": "terms.schema.yaml#/definitions/option" }
  reason: { "$ref": "terms.schema.yaml#/definitions/reason" }
  note: { type: string }
